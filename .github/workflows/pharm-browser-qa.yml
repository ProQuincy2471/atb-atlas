name: Pharmacology clinical browser QA
on:
  pull_request:
    paths:
      - 'pharm-catalog.js'
      - 'pharm-catalog.css'
      - 'index.html'
      - 'infeora/index.html'
      - 'data/pharm-clinical-*.js'
      - 'qa/pharm-catalog-browser.cjs'
      - '.github/workflows/pharm-browser-qa.yml'
  push:
    branches: [main]
    paths:
      - 'pharm-catalog.js'
      - 'data/pharm-clinical-*.js'
permissions:
  contents: read
jobs:
  pharmacology-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and browser runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          if command -v google-chrome >/dev/null; then
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "CHROME_BIN=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Validate sourced regimens and five territories in Chromium
        run: node qa/pharm-catalog-browser.cjs
      - name: Upload pharmacology visual captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pharm-browser-qa
          path: qa/results-pharm/
          if-no-files-found: ignore
          retention-days: 7
