name: Atlas visual and functional QA
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: atlas-qa-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          if command -v google-chrome >/dev/null; then
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "CHROME_BIN=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Test routes and responsive layouts
        run: node qa/browser-qa.cjs
      - name: Validate viral, fungal and parasitic atlas V24
        if: always()
        run: node qa/v24-browser.cjs
      - name: Validate clinical map and syndromic reviews V25
        if: always()
        run: node qa/v25-browser.cjs
      - name: Validate INFEORA V26 visual and functional experience
        if: always()
        run: node qa/infeora-v26-browser.cjs
      - name: Validate INFEORA V27 audit fixes and deep syndrome reviews
        if: always()
        run: node qa/v27-browser.cjs
      - name: Validate CARDIORA cardiology guide
        if: always()
        run: node qa/cardio-browser.cjs
      - name: Upload viewport captures and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-visual-qa
          path: |
            qa/results/
            qa/results24/
            qa/results25/
            qa/results26/
            qa/results27/
            qa/results-cardio/
          retention-days: 7
